name: CI

# push on main only + pull_request: avoids double runs on PR branches while
# still producing the required status check on fork PRs.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: both jobs only read the checkout. CodeQL flagged the absence
# of this block, and an unset `permissions` inherits whatever the repo default is.
permissions:
  contents: read

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      # -race because concurrency is the core of the scheduler: components in a
      # cycle activate on separate goroutines, so a data race is a correctness
      # bug this suite is expected to catch.
      #
      # -coverpkg=./... because the integration suites live in their own
      # packages and would otherwise contribute nothing to the figures — the
      # per-package numbers land in the mid-70s without it.
      - name: Run tests
        run: make ci-test

      # Coverage is measured but not published to a third party. The profile is
      # kept as a build artifact so the number for any run stays retrievable:
      # download it and run `go tool cover -func=coverage.out`, or `-html` for
      # the annotated source. `make cover` does the same locally.
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14

      # Pinned so a new golangci-lint release cannot turn CI red without a repo
      # change; keep in step with the version developers run locally.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # CONTRIBUTING asks for `make fmt`, which rewrites files; CI has to check
      # rather than rewrite, so it asserts gofmt finds nothing to change.
      - name: gofmt
        run: make fmt-check
